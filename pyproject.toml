[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regesh"
version = "0.1.0"
description = "Replayable persistent affect and cognitive regulation research platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
regesh = "regesh.cli:main"
regesh-install = "regesh.integrations.cli:main"
regesh-mcp = "regesh.integrations.mcp_server:main"
regesh-hook = "regesh.integrations.hooks:main"

[tool.setuptools.packages.find]
include = ["regesh*"]

[tool.setuptools.package-data]
regesh = ["data/*.json", "data/*.npz", "integrations/templates/*"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7"]
papers = ["scipy>=1.10"]
